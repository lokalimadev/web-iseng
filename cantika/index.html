<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantika ❤️ Hilmi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        /* Background blur dari foto */
        
        .background {
            position: fixed;
            inset: 0;
            background: url('foto.jpg') center center/cover no-repeat;
            filter: blur(30px) brightness(0.4);
            transform: scale(1.2);
            z-index: -2;
        }
        
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: -1;
        }
        
        .player {
            width: 90%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
        }
        /* Dynamic Island */
        
        .island {
            width: 120px;
            height: 34px;
            background: black;
            border-radius: 50px;
            margin: 0 auto 25px;
        }
        
        .cover {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            animation: zoom 8s ease-in-out infinite alternate;
        }
        
        @keyframes zoom {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.05);
            }
        }
        
        .info {
            margin-top: 22px;
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
        }
        
        .artist {
            margin-top: 6px;
            font-size: 18px;
            opacity: .8;
        }
        
        .progress {
            margin-top: 25px;
        }
        
        .bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, .2);
            border-radius: 20px;
            overflow: hidden;
        }
        
        .fill {
            width: 0%;
            height: 100%;
            background: white;
            animation: music 25s linear infinite;
        }
        
        @keyframes music {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }
        
        .time {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            opacity: .7;
        }
        
        .marquee {
            margin-top: 30px;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 12s linear infinite;
            font-size: 20px;
            font-weight: 600;
        }
        
        @keyframes scroll {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-100%);
            }
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            opacity: .75;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <div class="player">

        <div class="island"></div>

        <img src="foto.jpg" class="cover" alt="Cantika">

        <div class="info">
            <div class="title">
                Cantika Tetap Cinta Mati
            </div>

            <div class="artist">
                Hilmi ❤️
            </div>
        </div>

        <div class="progress">
            <div class="bar">
                <div class="fill"></div>
            </div>

            <div class="time">
                <span>0:00</span>
                <span>∞</span>
            </div>
        </div>

        <div class="marquee">
            <span>
            ❤️ Cantika tetap cinta mati sama Hilmi ❤️ Cantika tetap cinta mati sama Hilmi ❤️ Cantika tetap cinta mati sama Hilmi ❤️
        </span>
        </div>

        <div class="footer">
            Now Playing 🎵
        </div>

    </div>

    <button id="playBtn">🎵 Tap Untuk Memulai</button>

    <audio id="music" loop>
    <source src="lagu.mp3" type="audio/mpeg">
</audio>

    <script>
        const music = document.getElementById('music');
        const btn = document.getElementById('playBtn');

        btn.addEventListener('click', () => {
            music.play();
            btn.style.display = 'none';
        });
    </script>

    <audio autoplay loop controls style="display:none;">
    <source src="lagu.mp3" type="audio/mpeg">
</audio>

</body>

</html>
